<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Studio</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a href="{{ url_for('index') }}" class="brand">✦ AI Video Studio</a><span>Audio → Video → YouTube</span></header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
{% block content %}{% endblock %}
</main><footer>Free-quota-first starter · Keep API keys private</footer></body></html>
